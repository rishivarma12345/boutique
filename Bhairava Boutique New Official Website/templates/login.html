<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="form-wrap"><form id="login"><h1>Admin Login</h1><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn">Login</button><p id="result"></p></form></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});let x=await r.json();if(x.token){localStorage.setItem('bb_token',x.token);location='/admin'}else document.getElementById('result').textContent=x.error}</script></body></html>
