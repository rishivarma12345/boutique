<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Bhairava Boutique</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><header><div class="brand">Bhairava Boutique Admin</div><nav><a href="/">View Site</a><a href="/products">Collections</a></nav><button onclick="localStorage.removeItem('bb_token');location='/admin/login'">Logout</button></header>
<main class="container">
<h1>Admin Portal</h1>
<section class="admin-tabs" role="tablist" aria-label="Admin sections"><button id="appointmentsTabButton" class="btn admin-tab active" role="tab" aria-selected="true" onclick="showTab('appointments')">Appointments</button><button id="collectionsTabButton" class="btn admin-tab ghost" role="tab" aria-selected="false" onclick="showTab('collections')">Collections</button></section>
<section id="appointmentsTab"><h2>Appointments</h2><p id="status">Connecting to live notifications...</p><div id="notice" style="display:none;padding:12px;margin:12px 0;border:1px solid #ddd;border-radius:8px"></div>
<section style="padding:16px;border:1px solid #ddd;border-radius:10px;margin:12px 0;background:#fafafa"><div style="display:grid;grid-template-columns:minmax(220px,2fr) minmax(150px,1fr) minmax(150px,1fr) auto;gap:10px;align-items:end"><label>Search<br><input id="search" type="search" placeholder="Name, phone, email, type, message" style="width:100%;box-sizing:border-box;padding:10px"></label><label>Status<br><select id="filterStatus" style="width:100%;padding:10px"><option>All</option><option>Pending</option><option>In Progress</option><option>Ready</option><option>Completed</option><option>Cancelled</option></select></label><label>Date<br><input id="filterDate" type="date" style="width:100%;box-sizing:border-box;padding:10px"></label><button class="btn" onclick="clearFilters()">Clear</button></div></section>
<div id="summary" style="margin:12px 0;font-size:14px"></div><div id="appointments"></div><div id="pagination" style="display:flex;gap:8px;justify-content:center;align-items:center;margin:20px 0;flex-wrap:wrap"></div></section>
<section id="collectionsTab" style="display:none"><h2>Collections Management</h2><p>Add new sarees, blouses and other items by category. When stock reaches zero, the item is automatically removed from the public collection.</p>
<form id="productForm" style="padding:18px;border:1px solid #ddd;border-radius:10px;background:#fafafa;margin:15px 0"><h3 id="formTitle">Add New Collection Item</h3><input type="hidden" id="editId"><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><label>Name<br><input id="pName" required placeholder="e.g. Kanchipuram Silk Saree"></label><label>Category<br><select id="pCategory" required><option>Bridal</option><option>Non-Bridal</option><option>Kids</option><option>Sarees</option><option>Blouses</option></select></label><label>Price (₹)<br><input id="pPrice" type="number" min="0" step="0.01" required></label><label>Stock quantity<br><input id="pStock" type="number" min="0" step="1" required></label></div><label>Description<br><textarea id="pDescription" rows="4" placeholder="Describe the collection item"></textarea></label><label>Product image<br><input id="pImage" type="file" accept="image/jpeg,image/png,image/webp"></label><div><button class="btn" type="submit" id="saveProductBtn">Add Collection</button><button class="btn ghost" type="button" onclick="resetProductForm()">Clear</button></div><p id="productResult"></p></form>
<section style="padding:16px;border:1px solid #ddd;border-radius:10px;background:#fafafa"><div style="display:grid;grid-template-columns:minmax(220px,2fr) 180px 160px auto;gap:10px;align-items:end"><label>Search<br><input id="productSearch" type="search" placeholder="Search collection"></label><label>Category<br><select id="productCategory"><option>All</option><option>Bridal</option><option>Non-Bridal</option><option>Kids</option><option>Sarees</option><option>Blouses</option></select></label><label>Inventory<br><select id="productStock"><option>All</option><option>Published</option><option>In Stock</option><option>Sold Out</option><option>Archived</option></select></label><button class="btn" onclick="loadAdminProducts()">Refresh</button></div></section><div id="productSummary" style="margin:12px 0;font-size:14px"></div><div id="adminProducts"></div></section>
</main>
<script>
const token=localStorage.getItem('bb_token');if(!token)location='/admin/login';
const statusEl=document.getElementById('status'),notice=document.getElementById('notice'),list=document.getElementById('appointments');const searchEl=document.getElementById('search'),statusFilterEl=document.getElementById('filterStatus'),dateEl=document.getElementById('filterDate'),summary=document.getElementById('summary'),pagination=document.getElementById('pagination');let currentPage=1,timer=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showTab(tab){
  const appointments=tab==='appointments';
  document.getElementById('appointmentsTab').style.display=appointments?'block':'none';
  document.getElementById('collectionsTab').style.display=appointments?'none':'block';
  const aBtn=document.getElementById('appointmentsTabButton'),cBtn=document.getElementById('collectionsTabButton');
  aBtn.classList.toggle('active',appointments);
  aBtn.classList.toggle('ghost',!appointments);
  cBtn.classList.toggle('active',!appointments);
  cBtn.classList.toggle('ghost',appointments);
  aBtn.setAttribute('aria-selected',appointments?'true':'false');
  cBtn.setAttribute('aria-selected',appointments?'false':'true');
  if(appointments){ aBtn.focus({preventScroll:true}); } else { cBtn.focus({preventScroll:true}); loadAdminProducts(); }
}
function statusOptions(current){return ['Pending','In Progress','Ready','Completed','Cancelled'].map(x=>`<option ${x===current?'selected':''}>${x}</option>`).join('');}
function debounceLoad(){clearTimeout(timer);timer=setTimeout(()=>{currentPage=1;load();},300)}searchEl.addEventListener('input',debounceLoad);statusFilterEl.addEventListener('change',()=>{currentPage=1;load()});dateEl.addEventListener('change',()=>{currentPage=1;load()});
function clearFilters(){searchEl.value='';statusFilterEl.value='All';dateEl.value='';currentPage=1;load()}
async function load(){const params=new URLSearchParams({page:currentPage,limit:10});if(searchEl.value.trim())params.set('q',searchEl.value.trim());if(statusFilterEl.value!=='All')params.set('status',statusFilterEl.value);if(dateEl.value)params.set('date',dateEl.value);const r=await fetch('/api/admin/appointments?'+params,{headers:{Authorization:'Bearer '+token}});if(r.status===401){localStorage.removeItem('bb_token');location='/admin/login';return}const x=await r.json();if(!r.ok){list.innerHTML='<p>Could not load appointments.</p>';return}const arr=x.appointments||[];const start=x.total?((x.page-1)*x.limit)+1:0;const end=Math.min(x.page*x.limit,x.total);summary.textContent=`Showing ${start}–${end} of ${x.total} appointment${x.total===1?'':'s'}`;list.innerHTML=arr.map(a=>`<article style="border:1px solid #ddd;border-radius:10px;padding:16px;margin:12px 0"><h3>${esc(a.name)} <small>${esc(a.phone)}</small></h3><p><b>Email:</b> ${esc(a.email)}<br><b>Type:</b> ${esc(a.appointment_type)}<br><b>Date:</b> ${esc(a.appointment_date)}<br><b>Time:</b> ${esc(a.appointment_time)}<br><b>Message:</b> ${esc(a.message)}</p><label>Status <select id="status-${a.id}" onchange="changeStatus('${a.id}',this.value)">${statusOptions(a.status)}</select></label><div id="notify-${a.id}" style="margin-top:12px"></div></article>`).join('')||'<p>No appointments found.</p>';arr.forEach(a=>{if(a.status==='Ready'||a.status==='Completed')renderNotify(a.id,a.status,a,a.notification_description||'',a)});renderPagination(x.page,x.pages)}
function renderPagination(page,pages){if(pages<=1){pagination.innerHTML='';return}let html=`<button class="btn" ${page<=1?'disabled':''} onclick="goPage(${page-1})">Previous</button>`;const from=Math.max(1,page-2),to=Math.min(pages,page+2);for(let i=from;i<=to;i++)html+=`<button class="btn" ${i===page?'disabled':''} onclick="goPage(${i})">${i}</button>`;html+=`<button class="btn" ${page>=pages?'disabled':''} onclick="goPage(${page+1})">Next</button>`;pagination.innerHTML=html}function goPage(p){currentPage=p;load();window.scrollTo({top:0,behavior:'smooth'})}
function changeStatus(id,status){if(status==='Ready'||status==='Completed'){renderNotifyEditor(id,status,'',true);return}saveStatus(id,status,'')}
async function saveStatus(id,status,description){const r=await fetch('/api/admin/appointments/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status,description})});const x=await r.json();if(!r.ok){alert(x.error||'Could not update');return}load()}
function renderNotifyEditor(id,status,description,showSave){const box=document.getElementById('notify-'+id);if(!box)return;const label=status==='Ready'?'Order / Item Ready':'Order Completed';box.innerHTML=`<div style="padding:14px;border:1px solid #ddd;border-radius:10px;background:#fafafa"><strong>${label}</strong><p style="margin:6px 0 10px">Enter the message you want to send to the customer. Nothing will be sent automatically without your description.</p><textarea id="desc-${id}" rows="5" placeholder="Enter your customer notification..." style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px">${esc(description)}</textarea>${showSave?`<button class="btn" style="margin-top:10px" onclick="saveDescriptionAndStatus('${id}','${status}')">Save Status & Prepare Notification</button>`:''}</div>`}
function saveDescriptionAndStatus(id,status){const el=document.getElementById('desc-'+id),description=(el?.value||'').trim();if(!description){alert('Please enter a notification description before saving Ready or Completed.');el?.focus();return}saveStatus(id,status,description)}
function renderNotify(id,status,a,description,x){const box=document.getElementById('notify-'+id);if(!box)return;const label=status==='Ready'?'Order / Item Ready':'Order Completed';const urls=x||{};box.innerHTML=`<div style="padding:14px;border:1px solid #ddd;border-radius:10px;background:#fafafa"><strong>${label}</strong><p><b>Customer notification description:</b></p><textarea id="desc-${id}" rows="5" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px">${esc(description)}</textarea><button class="btn" style="margin-top:10px" onclick="updateNotificationMessage('${id}','${status}')">Update Notification Message</button><p>Send this description to the customer:</p><div style="display:flex;gap:8px;flex-wrap:wrap">${urls.whatsapp_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(urls.whatsapp_url)}">Send WhatsApp</a>`:''}${urls.sms_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(urls.sms_url)}">Send SMS</a>`:''}${urls.email_url?`<a class="btn" target="_blank" rel="noopener" href="${esc(urls.email_url)}">Send Email</a>`:''}</div></div>`}
async function updateNotificationMessage(id,status){const el=document.getElementById('desc-'+id),description=(el?.value||'').trim();if(!description){alert('Please enter a notification description.');el?.focus();return}saveStatus(id,status,description)}
load();const events=new EventSource('/api/admin/events?token='+encodeURIComponent(token));events.onopen=()=>statusEl.textContent='Live notifications connected';events.onerror=()=>statusEl.textContent='Live notifications disconnected — retrying...';events.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==='new_appointment'){const a=x.appointment;notice.style.display='block';notice.textContent='New appointment: '+a.name+' — '+a.appointment_date+' '+a.appointment_time+' — '+a.phone;load()}if(x.type==='appointment_status'){notice.style.display='block';notice.textContent='Appointment status updated: '+x.appointment.name+' → '+x.appointment.status;load()}};

const productForm=document.getElementById('productForm');let productTimer=null;document.getElementById('productSearch').addEventListener('input',()=>{clearTimeout(productTimer);productTimer=setTimeout(loadAdminProducts,250)});document.getElementById('productCategory').addEventListener('change',loadAdminProducts);document.getElementById('productStock').addEventListener('change',loadAdminProducts);
function resetProductForm(){productForm.reset();document.getElementById('editId').value='';document.getElementById('formTitle').textContent='Add New Collection Item';document.getElementById('saveProductBtn').textContent='Add Collection';document.getElementById('productResult').textContent=''}
productForm.onsubmit=async e=>{e.preventDefault();const id=document.getElementById('editId').value;const payload={name:document.getElementById('pName').value.trim(),category:document.getElementById('pCategory').value,description:document.getElementById('pDescription').value.trim(),price:Number(document.getElementById('pPrice').value),stock:Number(document.getElementById('pStock').value),active:true};const r=await fetch(id?'/api/admin/products/'+id:'/api/admin/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(payload)});const x=await r.json();if(!r.ok){document.getElementById('productResult').textContent=x.error||'Could not save';return}const productId=id||x.id;const image=document.getElementById('pImage').files[0];if(image){const fd=new FormData();fd.append('image',image);const ir=await fetch('/api/admin/products/'+productId+'/image',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const ix=await ir.json();if(!ir.ok){document.getElementById('productResult').textContent=ix.error||'Product saved but image failed';loadAdminProducts();return}}document.getElementById('productResult').textContent=id?'Collection updated successfully.':'New collection added successfully.';resetProductForm();loadAdminProducts()};
async function loadAdminProducts(){const q=document.getElementById('productSearch').value.trim(),category=document.getElementById('productCategory').value,stock=document.getElementById('productStock').value;const p=new URLSearchParams();if(q)p.set('q',q);if(category!=='All')p.set('category',category);if(stock!=='All')p.set('stock',stock);const r=await fetch('/api/admin/products?'+p,{headers:{Authorization:'Bearer '+token}});if(r.status===401){localStorage.removeItem('bb_token');location='/admin/login';return}const items=await r.json();document.getElementById('productSummary').textContent=`${items.length} collection item${items.length===1?'':'s'} found`;document.getElementById('adminProducts').innerHTML=items.map(p=>`<article style="display:grid;grid-template-columns:100px 1fr auto;gap:15px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0;background:white"><div style="width:100px;height:100px;background:#eee;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" style="width:100%;height:100%;object-fit:cover">`:'No image'}</div><div><h3 style="margin:0 0 5px">${esc(p.name)}</h3><p style="margin:3px 0"><b>${esc(p.category)}</b> · ₹${Number(p.price).toLocaleString('en-IN')} · Stock: <b>${p.stock}</b></p><p style="margin:3px 0">${esc(p.description||'')}</p><small>${p.active&&p.stock>0?'Published':'Sold Out / Archived'}</small></div><div><button class="btn" onclick='editProduct(${JSON.stringify(p)})'>Edit</button><button class="btn" onclick='archiveProduct("${p.id}")'>Remove</button></div></article>`).join('')||'<p>No collection items found.</p>'}
function editProduct(p){document.getElementById('editId').value=p.id;document.getElementById('pName').value=p.name;document.getElementById('pCategory').value=p.category;document.getElementById('pDescription').value=p.description||'';document.getElementById('pPrice').value=p.price;document.getElementById('pStock').value=p.stock;document.getElementById('formTitle').textContent='Edit Collection Item';document.getElementById('saveProductBtn').textContent='Save Changes';window.scrollTo({top:0,behavior:'smooth'})}
async function archiveProduct(id){if(!confirm('Permanently remove this collection item from the admin and public collections? This cannot be undone.'))return;const r=await fetch('/api/admin/products/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});const x=await r.json();if(!r.ok){alert(x.error||'Could not remove item');return}if(document.getElementById('editId').value===id)resetProductForm();document.getElementById('productResult').textContent='Collection item removed successfully.';loadAdminProducts()}
</script></body></html>
