<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Appointment | Bhairava Boutique</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
  <div class="brand">Bhairava Boutique</div>
  <nav><a href="/" data-nav="home">Home</a><a href="/products" data-nav="collections">Collections</a><a href="/appointment" data-nav="appointment">Appointment</a></nav>
</header>
<main class="form-wrap">
  <form id="appointment">
    <h1>Book an Appointment</h1>
    <input name="name" placeholder="Your name" required>
    <input name="phone" placeholder="WhatsApp / phone" required>
    <input name="email" type="email" placeholder="Email">
    <select name="appointment_type"><option>Video Call</option><option>Boutique Visit</option></select>
    <input name="appointment_date" type="date" required>
    <input name="appointment_time" type="time" required>
    <textarea name="message" placeholder="What would you like to see?"></textarea>
    <button class="btn" type="submit">Send Request</button>
    <p id="result" role="status"></p>

    <div id="successModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="successTitle">
      <div class="modal-card">
        <button id="closeModal" class="modal-close" type="button" aria-label="Close">&times;</button>
        <h2 id="successTitle">Appointment Request Received</h2>
        <p>Thank you. Your appointment request has been received successfully.</p>
        <p id="redirectMessage" class="redirect-message">You will be redirected to Home shortly.</p>
        <div class="modal-actions">
          <button id="whatsappButton" class="btn" type="button">Send WhatsApp</button>
          <button id="smsButton" class="btn" type="button">Send SMS</button>
          <button id="emailButton" class="btn" type="button">Send Email</button>
          <button id="doneButton" class="btn ghost" type="button">Close &amp; Go Home</button>
        </div>
      </div>
    </div>
  </form>
</main>
<script>
const form = document.getElementById('appointment');
const result = document.getElementById('result');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  button.textContent = 'Sending...';

  try {
    const data = Object.fromEntries(new FormData(form));
    const response = await fetch('/api/appointments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    const payload = await response.json();

    if (!response.ok) throw new Error(payload.error || 'Could not book appointment');

    // Show the confirmation popup only after the appointment has been
    // successfully saved by the server. WhatsApp/SMS are user-initiated
    // free links; nothing is opened automatically.
    const modal = document.getElementById('successModal');
    const whatsappButton = document.getElementById('whatsappButton');
    const smsButton = document.getElementById('smsButton');
    const emailButton = document.getElementById('emailButton');

    whatsappButton.onclick = () => {
      if (payload.whatsapp_url) {
        // Navigate directly so mobile browsers reliably hand the link to WhatsApp.
        window.open(payload.whatsapp_url, '_blank', 'noopener,noreferrer');
      } else {
        result.textContent = 'WhatsApp number is not configured. Add WHATSAPP_NUMBER to .env and restart the Go server.';
      }
    };

    smsButton.onclick = () => {
      if (payload.sms_url) {
        window.open(payload.sms_url, '_blank', 'noopener,noreferrer');
      } else {
        result.textContent = 'WhatsApp/SMS number is not configured.';
      }
    };

    emailButton.onclick = () => {
      if (payload.email_url) {
        window.open(payload.email_url, '_blank', 'noopener,noreferrer');
      } else {
        result.textContent = 'No email address is available for this appointment.';
      }
    };

    modal.hidden = false;
    form.querySelectorAll('input, select, textarea, button[type="submit"]').forEach(el => el.disabled = true);

    // No countdown timer: the confirmation popup stays open until the user
    // chooses WhatsApp, SMS, Email, or Close & Go Home.

  } catch (err) {
    result.textContent = err.message;
    button.disabled = false;
    button.textContent = 'Send Request';
  }
});

function closeSuccessModal() {
  const modal = document.getElementById('successModal');
  modal.hidden = true;
  window.location.href = '/';
  form.reset();
  result.textContent = '';
  const submitButton = form.querySelector('button[type=\"submit\"]');
  submitButton.disabled = false;
  submitButton.textContent = 'Send Request';
}

document.getElementById('closeModal').addEventListener('click', closeSuccessModal);
document.getElementById('doneButton').addEventListener('click', closeSuccessModal);
</script>
<script>
(() => {
  const path = location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('nav a[data-nav]').forEach(a => {
    const href = new URL(a.href, location.origin).pathname.replace(/\/$/, '') || '/';
    const current = href === path;
    a.classList.toggle('current', current);
    if (current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
})();
</script>
</body>
</html>
