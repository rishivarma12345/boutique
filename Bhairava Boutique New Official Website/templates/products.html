<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections | Bhairava Boutique</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header><div class="brand">Bhairava Boutique</div><nav><a href="/" data-nav="home">Home</a><a href="/products" data-nav="collections">Collections</a><a href="/appointment" data-nav="appointment">Appointment</a></nav></header><main class="container"><h1>Collections</h1><div class="filters" role="tablist" aria-label="Collection categories"><button type="button" class="category-filter active" data-category="" onclick="loadProducts('')">All</button><button type="button" class="category-filter" data-category="Bridal" onclick="loadProducts('Bridal')">Bridal</button><button type="button" class="category-filter" data-category="Non-Bridal" onclick="loadProducts('Non-Bridal')">Non-Bridal</button><button type="button" class="category-filter" data-category="Kids" onclick="loadProducts('Kids')">Kids</button><button type="button" class="category-filter" data-category="Sarees" onclick="loadProducts('Sarees')">Sarees</button><button type="button" class="category-filter" data-category="Blouses" onclick="loadProducts('Blouses')">Blouses</button></div><div id="products" class="grid"></div></main><script src="/static/js/app.js"></script><script>
(() => {
  const path = location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('nav a[data-nav]').forEach(a => {
    const href = new URL(a.href, location.origin).pathname.replace(/\/$/, '') || '/';
    const current = href === path;
    a.classList.toggle('current', current);
    if (current) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
})();
</script>
</body></html>
